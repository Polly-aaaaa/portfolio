<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Кейс — Полина Артамонова</title>
  <meta name="robots" content="noindex" />
  <!-- Старые ссылки вида case.html?id=corp ведут на статичные страницы case-corp.html -->
  <script>
    const id = new URLSearchParams(location.search).get('id');
    location.replace(/^[a-z]+$/.test(id || '') ? `case-${id}.html` : 'index.html#work');
  </script>
</head>
<body><a href="index.html#work">Все проекты</a></body>
</html>
